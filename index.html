<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Мой план</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@property --p{syntax:'<number>';inherits:false;initial-value:0}
:root{--y:#ffd60a;--g:#30d158;--hint:rgba(235,235,245,.55);--glass:rgba(255,255,255,.08);--line:rgba(255,255,255,.13);--ease:cubic-bezier(.2,.9,.2,1)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%;background:#000}
body{font:400 16px/1.35 -apple-system,"SF Pro Text",system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased;display:flex;justify-content:center;align-items:center;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
#app{position:relative;width:100%;max-width:430px;height:100dvh;overflow:hidden;background:#000}
@media(min-width:600px){#app{width:390px;height:min(844px,96vh);border-radius:46px;border:1px solid #2a2a2c}}
#main{height:100%;overflow-y:auto;overflow-x:hidden;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(118px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
#main.ns{overflow:hidden}
h1{font:700 30px/1.15 -apple-system,system-ui,sans-serif;letter-spacing:-.02em;margin-bottom:14px}
.sub{color:var(--hint);font-size:13px}
.huge{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.c{text-align:center}
.card,.np,.plus,.pill,.sm{background:var(--glass);border:.5px solid var(--line);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.card{border-radius:22px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
button{font:inherit;color:inherit;border:0;background:none;transition:transform .35s var(--ease),opacity .2s,background .2s}
button:active,.press:active{transform:scale(.94)}
.press{transition:transform .35s var(--ease)}
[data-k]{transition:opacity .25s,transform .3s var(--ease)}
.out{opacity:0;transform:scale(.88)}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{50%{transform:scale(1.3)}}
@keyframes sw{from{opacity:0;transform:translateY(6px)}}
.scr.anim>*{animation:in .55s var(--ease) both}
.scr.anim>:nth-child(2){animation-delay:.06s}.scr.anim>:nth-child(3){animation-delay:.12s}.scr.anim>:nth-child(4){animation-delay:.18s}.scr.anim>:nth-child(5){animation-delay:.24s}
.pop{animation:pop .3s}.sw{animation:sw .3s}
.x{color:var(--hint);font-size:22px;padding:2px 6px}
nav{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:10px;pointer-events:none;z-index:5}
nav>*{pointer-events:auto}
.np{display:flex;padding:5px;border-radius:30px;background:rgba(40,40,44,.55)}
.np button{width:54px;height:48px;border-radius:24px;color:var(--hint);display:grid;place-items:center}
.np button.on{background:rgba(255,255,255,.16);color:#fff}
.plus{width:58px;height:58px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;border:0}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.plus svg{width:26px;height:26px;stroke-width:2.4}
.ops{margin:calc(-18px - env(safe-area-inset-top,0px)) -16px 0;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 12px;border-radius:0 0 36px 36px;background:#1b1b1d;text-align:center;border-bottom:.5px solid var(--line)}
.ob{display:flex;align-items:center;justify-content:center;gap:10px;font-size:20px;font-weight:600;min-height:46px}
.ob svg{fill:currentColor;stroke:none;width:26px;height:26px;color:#d4d4d8}
.oval{max-height:0;opacity:0;overflow:hidden;transition:max-height .5s var(--ease),opacity .35s}
.ops.open .oval{max-height:120px;opacity:1}
.oval b{display:block;font-size:30px;letter-spacing:-.02em;margin:2px 0}
.bal{height:100%;display:flex;flex-direction:column}
.dots2{display:flex;gap:7px;justify-content:center;margin-top:14px;height:8px}
.dots2 i{width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.28);transition:width .4s var(--ease),background .3s}
.dots2 i.on{width:22px;background:#fff}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.bal .huge{font-size:60px}
.pill{display:inline-flex;gap:8px;align-items:baseline;padding:6px 14px;border-radius:20px;font-size:15px;background:rgba(255,255,255,.12)}
.pill span{color:var(--hint)}
.slot{position:relative;height:122px;overflow:hidden;margin:0 -16px 14px}
.slot::after{content:"";position:absolute;left:-14%;right:-14%;bottom:-36px;height:72px;border-radius:50%;background:#000;border-top:1.5px solid rgba(255,255,255,.16);z-index:3;pointer-events:none}
.car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 19%;height:100%;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.car::-webkit-scrollbar{display:none}
.bc{flex:0 0 62%;aspect-ratio:1.586;border-radius:24px;scroll-snap-align:center;padding:16px;text-align:left;position:relative;overflow:hidden;transform:scale(.88);opacity:.55;transition:transform .55s var(--ease),opacity .3s;border:.5px solid rgba(255,255,255,.18)}
.bc.act{transform:none;opacity:1}
.bc::before{content:"";position:absolute;top:-10%;bottom:-10%;left:36%;width:34%;background:linear-gradient(110deg,rgba(255,255,255,.2),rgba(255,255,255,0));transform:skewX(-24deg)}
.bn{font-size:17px;font-weight:700;position:relative}
.alfa{background:linear-gradient(135deg,#ff4a3d,#a3150d)}
.sber{background:linear-gradient(135deg,#34c25a,#0d6b2c)}
.vtb{background:linear-gradient(135deg,#2a63e0,#0a2a8a)}
.tbank{background:linear-gradient(135deg,#3b3b3f,#0d0d0f)}.tbank .bn,.tbank span{color:var(--y)}
.ozon{background:linear-gradient(135deg,#1b7bff,#4b1fb8)}
.empty{display:grid;place-items:center;font-size:16px;color:var(--hint);background:var(--glass)}
.op2{display:flex;align-items:center;justify-content:space-between;border-radius:30px;padding:18px 20px;margin:0;background:#1b1b1d}
.op2 b{font-size:22px;font-weight:700}
.op2 svg{color:var(--hint)}
.pks{display:flex;gap:10px;overflow-x:auto;padding:16px 18px 22px;margin:0 -18px;scrollbar-width:none}
.pks::-webkit-scrollbar{display:none}
.pk{flex:0 0 112px;height:72px;border-radius:16px;text-align:left;padding:10px;font-weight:700;font-size:14px;opacity:.5;transform:scale(.9);transition:transform .55s var(--ease),opacity .3s,box-shadow .3s;position:relative;overflow:hidden}
.pk.on{opacity:1;transform:translateY(-8px) scale(1.1);box-shadow:0 12px 26px rgba(0,0,0,.6),0 0 0 2px #fff}
.pk.on::after{content:"✓";position:absolute;right:9px;bottom:6px;animation:pop .45s}
.dcard{border-radius:38px;padding:28px 14px 24px;background:linear-gradient(180deg,#4f4f52,#252527 48%,#171718);border:.5px solid rgba(255,255,255,.18);text-align:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.dn1{font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.tag{display:inline-flex;gap:8px;align-items:center;margin-top:12px;padding:8px 16px;border-radius:13px;background:rgba(255,255,255,.14);color:#d4d4d8;font-weight:600;font-size:18px}
.tag svg{width:20px;height:20px;fill:currentColor;stroke:none}
.dimg{margin-top:46px}
.dimg svg,.dimg img{width:100%;height:auto;display:block;stroke:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bx{position:relative;border-radius:28px;padding:16px;min-height:176px;overflow:hidden}
.bl{font-size:13px;opacity:.75}
.bt{font-size:21px;font-weight:700;line-height:1.15;padding-right:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bic{position:absolute;right:10px;bottom:10px;width:84px;height:84px;stroke-width:1.2;transform:rotate(-6deg)}
.bx .x{position:absolute;top:8px;right:8px;color:rgba(255,255,255,.6)}
.cal{height:100%;display:flex;flex-direction:column;gap:10px}
.rings{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rings .card{margin:0;padding:12px;gap:10px}
.ring{--p:0;--c:var(--y);width:56px;height:56px;border-radius:50%;flex:none;position:relative;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),rgba(255,255,255,.14) 0);transition:--p 1.1s var(--ease)}
.ring::before{content:"";position:absolute;inset:6px;border-radius:50%;background:#16161a}
.ring span{position:relative;font-weight:700;font-size:14px}
.ring.g{--c:var(--g)}
.mh{display:flex;align-items:center;justify-content:space-between}
.mh b{text-transform:capitalize;font-size:21px}
.sm{width:40px;height:40px;border-radius:50%;font-size:22px}
.whd{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;color:var(--hint)}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;gap:6px}
.day{border-radius:16px;background:var(--glass);border:.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 1px 8px;font-size:20px;font-weight:600;transition:transform .35s var(--ease),background .25s}
.day.now{outline:1.5px solid var(--y);outline-offset:-1px}
.day.sel{background:rgba(255,255,255,.24)}
.tp{height:16px;display:flex;align-items:center;gap:2px;font-size:11px;font-weight:500;color:#bcd2ff;white-space:nowrap}
.tp em{font-style:normal}
.mi{width:13px;height:13px;fill:currentColor;stroke:none}
.mi.big{width:26px;height:26px;color:#bcd2ff}
.dots{height:6px}
.dots i{display:block;width:6px;height:6px;border-radius:50%;background:var(--y)}
.ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--hint);flex:none;display:grid;place-items:center;color:#000;font-weight:700;transition:background .25s,border-color .25s,transform .35s var(--ease)}
.ck.on{background:var(--y);border-color:var(--y)}.ck.on::after{content:"✓"}
.dn{text-decoration:line-through;opacity:.5}
#sheet{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .3s;z-index:9}
#sheet.open{opacity:1;pointer-events:auto}
.pane{width:100%;max-height:88%;overflow:auto;border-radius:30px 30px 0 0;background:rgba(30,30,34,.94);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);padding:10px 18px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .5s var(--ease)}
#sheet.open .pane{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.3);margin:0 auto 14px}
.ptitle{font-size:20px;font-weight:700;margin-bottom:10px}
.pane input,.pane textarea,.pane select{width:100%;font:inherit;font-size:16px;color:#fff;background:rgba(255,255,255,.09);border:0;border-radius:14px;padding:12px;margin:4px 0 10px;appearance:none;-webkit-appearance:none}
.pane .sub{margin-top:4px}
.btn{width:100%;margin-top:8px;border-radius:16px;padding:14px;background:#fff;color:#000;font-weight:600}
.btn.r{background:rgba(255,69,58,.18);color:#ff6961}
.btn.g{background:var(--glass);color:#fff}
.r2{display:flex;justify-content:space-between;padding:12px 0;border-bottom:.5px solid var(--line)}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;padding:9px;border-radius:12px;background:var(--glass)}
.seg button.on{background:#fff;color:#000;font-weight:600}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"><main id="main"></main><nav id="nav"></nav><div id="sheet" onclick="if(event.target==this)closeSheet()"><div class="pane" id="pane"></div></div></div>
<script>
const tg=window.Telegram&&Telegram.WebApp;
if(tg){try{tg.ready();tg.expand();tg.setHeaderColor('#000000');tg.setBackgroundColor('#000000')}catch(e){}}
const K='planner_v3';
let S={banks:[],car:{name:'Porsche Panamera',price:0,date:'',color:'#2b2b2e',img:''},buys:[],shifts:[],tasks:[],plan:15};
let tab='bal',vm=new Date(),selDay=null,lastTot=0,ci=0,pc='tbank',opsOpen=false,dayOpen=false;
try{const v=localStorage.getItem(K);if(v)S=Object.assign(S,JSON.parse(v))}catch(e){}
if(!S.car||!S.car.name)S.car=Object.assign({},S.car,{name:'Porsche Panamera',color:S.car&&S.car.color||'#2b2b2e'});
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rub=n=>Math.round(n).toLocaleString('ru-RU')+' ₽';
const kf=n=>n>=1000?(n/1000).toFixed(1).replace('.0','')+'к':Math.round(n);
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dt=(s,y)=>new Date(s+'T00:00').toLocaleDateString('ru-RU',y?{day:'numeric',month:'long',year:'numeric'}:{day:'numeric',month:'short'});
const sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);
const total=()=>sum(S.banks,b=>b.sum);
const spent=()=>sum(S.buys,b=>b.price);
const ym=()=>vm.getFullYear()+'-'+pad(vm.getMonth()+1);
const sv=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}render();if(dayOpen)openSheet(dayHTML(selDay),1)};
const hap=()=>{try{tg.HapticFeedback.impactOccurred('light')}catch(e){}};
document.addEventListener('click',e=>{if(e.target.closest('button,.press'))hap()});
const MOON='<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',SUN='<circle cx="12" cy="12" r="5.5"/>';
const NI={bal:'<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10.5h18M7 15h3"/>',dream:'<path d="M4 15l1.6-4.6A2 2 0 0 1 7.5 9h9a2 2 0 0 1 1.9 1.4L20 15v3a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-1H7v1a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1zM4 15h16"/>',buy:'<path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>'};
const nb=k=>`<button data-t="${k}" onclick="go('${k}')"><svg viewBox="0 0 24 24">${NI[k]}</svg></button>`;
$('#nav').innerHTML=`<div class="np">${nb('bal')}${nb('dream')}</div><button class="plus" onclick="add()"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button><div class="np">${nb('buy')}${nb('cal')}</div>`;

const BANKS=[['alfa','Альфа-Банк'],['sber','Сбербанк'],['vtb','ВТБ'],['tbank','Т-Банк'],['ozon','Озон Банк']];
const BN=Object.fromEntries(BANKS);
const code=b=>b.code||(/альф/i.test(b.name||'')?'alfa':/сбер/i.test(b.name||'')?'sber':/втб/i.test(b.name||'')?'vtb':/озон|ozon/i.test(b.name||'')?'ozon':'tbank');
const pk=c=>`<div class="pks">${BANKS.map(([k,n])=>`<button class="pk ${k} ${k==c?'on':''}" data-c="${k}" onclick="pickB('${k}')"><span>${n}</span></button>`).join('')}</div>`;
function pickB(c){pc=c;document.querySelectorAll('.pk').forEach(b=>b.classList.toggle('on',b.dataset.c==c))}

const IC=[['стол|парт','<rect x="3" y="8" width="18" height="3" rx="1"/><path d="M6 11v9M18 11v9"/>'],['стул|кресл','<path d="M8 3h8v8H8zM6 11h12v3H6zM8 14v7M16 14v7"/>'],['диван','<path d="M5 11V8a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v3M3 13a2 2 0 0 1 4 0v2h10v-2a2 2 0 0 1 4 0v4H3zM6 17v2M18 17v2"/>'],['кроват|матрас','<path d="M3 19V6M3 14h18v5M21 14v-2a3 3 0 0 0-3-3h-7v5"/>'],['телефон|айфон|iphone|смартфон','<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/>'],['ноут|макбук|компьют|macbook','<rect x="5" y="5" width="14" height="10" rx="1.5"/><path d="M3 19h18"/>'],['науш|airpods','<path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/>'],['часы','<rect x="7" y="6" width="10" height="12" rx="3"/><path d="M9 6l.8-3h4.4L15 6M9 18l.8 3h4.4l.8-3M12 10v2.5l1.5 1"/>'],['кросс|обув|ботин|туфл','<path d="M3 16v-5l5-1 2 2h4l5 2v3H3zM3 19h18"/>'],['куртк|футбол|худи|одежд|рубаш|джинс','<path d="M8 4L3 7l2 4 3-1v10h8V10l3 1 2-4-5-3a4 4 0 0 1-8 0z"/>'],['сумк|рюкзак','<path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2"/>'],['ламп|светиль','<path d="M8 3h8l3 8H5zM12 11v8M8 20h8"/>'],['велос','<circle cx="6" cy="16" r="3.5"/><circle cx="18" cy="16" r="3.5"/><path d="M6 16l4-8h5l3 8M12 16l3-8"/>'],['телев|монитор','<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M9 21h6M12 17v4"/>'],['книг','<path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h10"/>'],['камер|фотоаппарат','<rect x="3" y="7" width="18" height="13" rx="3"/><circle cx="12" cy="13.5" r="3.5"/><path d="M9 7l1.5-3h3L15 7"/>']];
const GIFT='<rect x="4" y="9" width="16" height="11" rx="2"/><path d="M12 9v11M3 9h18M12 9C9 9 7 8 7 6s3-2 5 3c2-5 5-5 5-3s-2 3-5 3"/>';
const ic=t=>{const f=IC.find(x=>new RegExp(x[0],'i').test(t));return f?f[1]:GIFT};
const PAL=[['#2f7d55','#1c4d36'],['#2f5fae','#1b3a73'],['#7d3f98','#4a2260'],['#b0662b','#703a14'],['#2b8088','#164f55'],['#9a3d52','#5e2030']];
const col=t=>PAL[[...t].reduce((a,c)=>a+c.charCodeAt(0),0)%PAL.length];

const carSVG=(c,f)=>{const w=x=>`<circle cx="${x}" cy="128" r="31" fill="#0a0a0a"/><circle cx="${x}" cy="128" r="24" fill="#151517"/><circle cx="${x}" cy="128" r="16" fill="url(#rg)"/><circle cx="${x}" cy="128" r="4" fill="#222"/>`,
b=f?'M14 116Q14 104 30 101L74 95Q104 70 160 60H220Q272 62 306 88L364 96Q388 100 388 114V128H14Z':'M16 118Q16 102 34 99L80 92Q108 66 156 62H238Q286 64 312 90L362 97Q386 101 386 116V128H16Z',
g=f?'M112 92Q130 72 160 68H212Q250 70 276 90Z':'M108 90Q122 70 154 68H190V90ZM198 68H236Q264 72 284 90H198Z';
return `<svg viewBox="0 0 400 160"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".25"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></linearGradient><radialGradient id="rg"><stop offset="0" stop-color="#e0e0e2"/><stop offset="1" stop-color="#5a5a5e"/></radialGradient></defs><ellipse cx="200" cy="152" rx="175" ry="8" fill="#fff" opacity=".1"/><path d="${b}" fill="${c}"/><path d="${b}" fill="url(#cg)"/><path d="${g}" fill="#0d0f14" opacity=".92"/><rect x="372" y="104" width="14" height="6" rx="3" fill="#ffe9a8"/><rect x="14" y="106" width="10" height="6" rx="3" fill="#ff453a"/>${w(96)}${w(306)}</svg>`};

function vBal(){
 const b=S.banks[ci]||S.banks[0],ac=[...new Set(S.shifts.map(s=>s.date))].sort().reverse().slice(0,3);
 return `<div class="scr bal"><div class="ops press ${opsOpen?'open':''}" onclick="this.classList.toggle('open');opsOpen=!opsOpen"><div class="ob"><svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0-6 6v4l-1.8 3.2A1 1 0 0 0 5 18h14a1 1 0 0 0 .8-1.8L18 13V9a6 6 0 0 0-6-6zM10 20a2 2 0 0 0 4 0z"/></svg>Операции</div><div class="oval"><div class="sub">Сумма всех покупок</div><b>${rub(spent())}</b><div class="sub">На счетах после покупок: ${rub(total()-spent())}</div></div></div>
 <div class="dots2">${S.banks.length>1?S.banks.map((_,i)=>`<i class="${i==ci?'on':''}"></i>`).join(''):''}</div>
 <div class="mid"><div class="pill" id="cur">${b?`<span>${BN[code(b)]}</span><b>${rub(b.sum)}</b>`:'<span>Карт пока нет</span>'}</div><div class="huge" id="tot">${rub(lastTot)}</div></div>
 <div class="slot"><div class="car" id="car" onscroll="cs(this)">${S.banks.map((b,i)=>`<div class="bc ${code(b)} ${i==ci?'act':''}" onclick="editBank(${b.id})"><div class="bn">${BN[code(b)]}</div></div>`).join('')||'<div class="bc empty act" onclick="add()">Добавьте карту</div>'}</div></div>
 <div class="card op2 press" onclick="openAcc()"><div><b>Операции</b><div class="sub">${ac.length?'Начисления: '+ac.map(d=>dt(d)).join(', '):'Начислений пока нет'}</div></div><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></div></div>`}
function cs(el){const c=el.children[0];if(!c||!S.banks.length)return;const i=Math.max(0,Math.min(S.banks.length-1,Math.round(el.scrollLeft/(c.offsetWidth+12))));if(i==ci)return;ci=i;hap();const b=S.banks[i],p=$('#cur');p.innerHTML=`<span>${BN[code(b)]}</span><b>${rub(b.sum)}</b>`;p.classList.remove('sw');void p.offsetWidth;p.classList.add('sw');[...el.children].forEach((x,j)=>x.classList.toggle('act',j==i));document.querySelectorAll('.dots2 i').forEach((d,j)=>d.classList.toggle('on',j==i))}
function countTo(el,to){const from=lastTot,t0=performance.now();lastTot=to;(function f(t){const k=Math.min(1,(t-t0)/800),e=1-Math.pow(1-k,3);el.textContent=rub(from+(to-from)*e);if(k<1)requestAnimationFrame(f)})(t0)}
function openAcc(){const L=[...S.shifts].sort((a,b)=>b.date.localeCompare(a.date));openSheet(`<div class="ptitle">Начисления</div>`+(L.map(s=>`<div class="r2"><span>${dt(s.date,1)}</span><b>+${rub(s.pay)}</b></div>`).join('')||'<p class="sub">Начислений пока нет. Добавьте смены в календаре.</p>'))}

function vDream(){const c=S.car,f=/porsche|panamera|bmw|audi|mercedes|tesla|порш|бмв|ауди|мерс/i.test(c.name);
 return `<div class="scr"><div class="dcard press" onclick="${c.price?'carInfo()':'editCar()'}"><div class="dn1">${esc(c.name)}</div><div class="tag"><svg viewBox="0 0 24 24"><path d="M9 3l1.6 4.4L15 9l-4.4 1.6L9 15l-1.6-4.4L3 9l4.4-1.6zM17 13l.9 2.6 2.6.9-2.6.9L17 20l-.9-2.6-2.6-.9 2.6-.9z"/></svg>Авто мечты</div><div class="dimg">${c.img?`<img src="${esc(c.img)}" onerror="this.outerHTML=carSVG('${c.color}',${f})">`:carSVG(c.color,f)}</div></div>`+
 (c.price?`<div class="huge c" style="margin-top:22px">${rub(c.price)}</div><div class="sub c" style="margin-top:6px">Нажмите на машину, чтобы увидеть сроки</div>`:'<div class="sub c" style="margin-top:22px">Нажмите на машину, чтобы указать цену и срок</div>')+'</div>'}
function carInfo(){const c=S.car,t=total(),left=Math.max(0,c.price-t),dl=c.date?Math.ceil((new Date(c.date+'T00:00')-new Date())/864e5):null;
 const inc=sum(S.shifts.filter(s=>s.date>=key(new Date(Date.now()-30*864e5))),s=>s.pay);
 const row=(a,b)=>`<div class="r2"><span>${a}</span><b>${b}</b></div>`;
 let h=`<div class="ptitle">${esc(c.name)}</div>`+row('Цена',rub(c.price))+row('Уже на счетах',rub(t));
 if(left<=0)h+='<p class="sub" style="margin-top:12px">Денег на счетах уже хватает.</p>';
 else{h+=row('Осталось накопить',rub(left));
  if(dl!==null)h+=row('Срок',dl>0?dt(c.date,1)+', дней: '+dl:'Срок наступил');
  if(dl>0)h+=row('Откладывать в день',rub(left/dl))+row('В неделю',rub(left/dl*7))+row('В месяц',rub(left/dl*30));
  h+='<div class="sub" style="margin:14px 0 2px">Нужный доход в месяц, чтобы купить к дню</div>'+[30,90,180,365].map(n=>row(n+'-му дню',rub(left*30/n))).join('')}
 if(inc)h+=`<div class="sub" style="margin-top:12px">Доход со смен за 30 дней: ${rub(inc)}</div>`;
 openSheet(h+'<button class="btn g" onclick="editCar()">Изменить машину</button>')}

function vBuy(){return `<div class="scr"><div class="c"><div class="sub">Сумма покупок</div><div class="huge">${rub(spent())}</div></div><div class="g2" style="margin-top:22px">${S.buys.map(b=>{const k=col(b.title);return `<div class="bx press" data-k="${b.id}" data-u="${esc(b.url||'')}" style="background:linear-gradient(145deg,${k[0]},${k[1]})" onclick="openL(this.dataset.u)"><div class="bl">${rub(b.price)}</div><div class="bt">${esc(b.title)}</div><svg class="bic" viewBox="0 0 24 24">${ic(b.title)}</svg><button class="x" onclick="event.stopPropagation();del('buys',${b.id},this)">×</button></div>`}).join('')}</div>${S.buys.length?'':'<p class="sub c" style="margin-top:14px">Нажмите +, чтобы добавить вещь.</p>'}</div>`}
function openL(u){if(!u)return;u=/^https?:\/\//.test(u)?u:'https://'+u;try{tg.openLink(u)}catch(e){window.open(u,'_blank')}}

const tcard=t=>`<div class="card row" data-k="${t.id}"><button class="ck ${t.done?'on':''}" onclick="tog(${t.id},this)"></button><div class="grow"><b class="${t.done?'dn':''}">${esc(t.title)}</b>${t.desc?`<div class="sub">${esc(t.desc)}</div>`:''}</div><button class="x" onclick="del('tasks',${t.id},this)">×</button></div>`;
const detail=k=>{const H=S.shifts.filter(s=>s.date==k),T=S.tasks.filter(t=>t.due==k);return H.map(s=>`<div class="card row between" data-k="${s.id}"><div class="row"><svg viewBox="0 0 24 24" class="mi big">${s.type=='n'?MOON:SUN}</svg><div><b>${s.type=='n'?'Ночная смена':'Дневная смена'}</b><div class="sub">${s.h} ч</div></div></div><b>${rub(s.pay)}</b><button class="x" onclick="del('shifts',${s.id},this)">×</button></div>`).join('')+T.map(tcard).join('')+((H.length||T.length)?'':'<p class="sub" style="margin-bottom:8px">На этот день ничего нет.</p>')};
const dayHTML=k=>`<div class="ptitle">${dt(k,1)}</div>`+detail(k)+'<button class="btn" onclick="calAdd(\'t\')">Добавить</button>';
const ring=(p,t,c)=>`<div class="ring ${c||''}" data-p="${p}"><span>${t}</span></div>`;
function vCal(){
 const y=vm.getFullYear(),mo=vm.getMonth(),p=ym(),now=key(new Date()),sd=selDay||now;
 const first=(new Date(y,mo,1).getDay()+6)%7,days=new Date(y,mo+1,0).getDate();
 const ms=S.shifts.filter(s=>s.date.startsWith(p)),nt=S.tasks.length,dn=S.tasks.filter(t=>t.done).length;
 let g='<i></i>'.repeat(first);
 for(let i=1;i<=days;i++){const k=p+'-'+pad(i),sh=S.shifts.filter(s=>s.date==k),tk=S.tasks.some(t=>t.due==k);
  g+=`<div class="day press ${k==now?'now':''} ${k==dayOpen&&0?'':''} ${selDay==k?'sel':''}" data-d="${k}" onclick="pickDay('${k}')"><div class="tp">${sh.length?`<svg viewBox="0 0 24 24" class="mi">${sh.some(s=>s.type=='n')?MOON:SUN}</svg><em>${kf(sum(sh,s=>s.pay))}</em>`:''}</div>${i}<div class="dots">${tk?'<i></i>':''}</div></div>`}
 return `<div class="scr cal"><div class="rings"><div class="card row">${ring(nt?dn/nt*100:0,dn+'/'+nt)}<div><b>Выполнено</b><div class="sub">задач: ${nt}</div></div></div><div class="card row press" onclick="editPlan()">${ring(S.plan?Math.min(100,ms.length/S.plan*100):0,ms.length+'/'+S.plan,'g')}<div><b>Смены</b><div class="sub">доход: ${kf(sum(ms,s=>s.pay))} ₽</div></div></div></div>
 <div class="mh"><button class="sm" onclick="mv(-1)">‹</button><b>${vm.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</b><button class="sm" onclick="mv(1)">›</button></div>
 <div class="whd">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div>${x}</div>`).join('')}</div><div class="grid">${g}</div></div>`}
function pickDay(k){selDay=k;document.querySelectorAll('.day').forEach(d=>d.classList.toggle('sel',d.dataset.d==k));openSheet(dayHTML(k),1)}

function render(anim){
 const m=$('#main');m.classList.toggle('ns',tab=='bal'||tab=='cal');
 m.innerHTML={bal:vBal,dream:vDream,buy:vBuy,cal:vCal}[tab]();
 if(anim===true)m.firstElementChild.classList.add('anim');
 document.querySelectorAll('#nav [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 setTimeout(()=>document.querySelectorAll('.ring[data-p]').forEach(r=>r.style.setProperty('--p',r.dataset.p)),40);
 if(tab=='bal'){countTo($('#tot'),total());const c=$('#car'),f=c.children[0];if(f&&S.banks.length)c.scrollLeft=ci*(f.offsetWidth+12)}
}
function go(t){tab=t;closeSheet();render(true);$('#main').scrollTop=0}
function mv(n){vm=new Date(vm.getFullYear(),vm.getMonth()+n,1);render(true)}
function del(c,id,el){const n=el&&el.closest('[data-k]'),f=()=>{S[c]=S[c].filter(x=>x.id!=id);ci=Math.max(0,Math.min(ci,S.banks.length-1));sv()};if(n){n.classList.add('out');setTimeout(f,260)}else f()}
function tog(id,el){el.classList.toggle('on');el.classList.add('pop');const t=S.tasks.find(x=>x.id==id);if(t)t.done=!t.done;setTimeout(sv,320)}
function openSheet(h,day){dayOpen=!!day;$('#pane').innerHTML='<div class="grab"></div>'+h;$('#sheet').classList.add('open')}
function closeSheet(){dayOpen=false;$('#sheet').classList.remove('open')}
const DL='<datalist id="dc"><option value="Porsche Panamera"><option value="Volkswagen Polo"><option value="Kia Rio"><option value="Hyundai Solaris"><option value="Skoda Rapid"><option value="Lada Vesta"></datalist>';
function form(title,f,fn,head='',foot=''){
 openSheet(`<div class="ptitle">${title}</div>${head}`+f.map(x=>`<div class="sub">${x.l}</div>`+(x.t=='ta'?`<textarea id="f_${x.id}" rows="3">${esc(x.v||'')}</textarea>`:x.t=='sel'?`<select id="f_${x.id}">${x.o.map(o=>`<option value="${o[0]}" ${o[0]==x.v?'selected':''}>${o[1]}</option>`).join('')}</select>`:`<input id="f_${x.id}" type="${x.t||'text'}" ${x.t=='number'?'inputmode="decimal"':''} value="${esc(x.v??'')}" ${x.dl?`list="${x.dl}"`:''}>`)).join('')+DL+`<button class="btn" id="ok">Сохранить</button>${foot}`);
 $('#ok').onclick=()=>{const v={};f.forEach(x=>{if(x.id)v[x.id]=$('#f_'+x.id).value.trim()});fn(v);closeSheet()}}
function editBank(id){const b=S.banks.find(x=>x.id==id);pc=code(b);form('Карта',[{id:'s',l:'Баланс, ₽',t:'number',v:b.sum}],v=>{b.code=pc;b.sum=+v.s||0;sv()},pk(pc),`<button class="btn r" onclick="closeSheet();del('banks',${id})">Удалить карту</button>`)}
function editCar(){const c=S.car;form('Машина мечты',[{id:'n',l:'Название',v:c.name,dl:'dc'},{id:'p',l:'Цена, ₽',t:'number',v:c.price||''},{id:'d',l:'К какой дате',t:'date',v:c.date},{id:'c',l:'Цвет рисунка',t:'sel',v:c.color,o:[['#2b2b2e','Чёрный'],['#e8e8ea','Белый'],['#8d9097','Серый'],['#1f4fbf','Синий'],['#b3202a','Красный']]},{id:'i',l:'Ссылка на фото (по желанию)',v:c.img}],v=>{S.car={name:v.n||'Моя машина',price:+v.p||0,date:v.d,color:v.c,img:v.i};sv()})}
function editPlan(){form('План смен в месяц',[{id:'p',l:'Сколько смен в месяц',t:'number',v:S.plan}],v=>{S.plan=+v.p||0;sv()})}
function calAdd(k){const d=selDay||key(new Date()),h=`<div class="seg"><button class="${k=='t'?'on':''}" onclick="calAdd('t')">Задача</button><button class="${k=='s'?'on':''}" onclick="calAdd('s')">Смена</button></div>`;
 if(k=='t')form('Новая запись',[{id:'t',l:'Название'},{id:'e',l:'Описание',t:'ta'},{id:'d',l:'Срок',t:'date',v:d}],v=>{if(!v.t)return;S.tasks.push({id:Date.now(),title:v.t,desc:v.e,due:v.d||d,done:false});sv()},h);
 else form('Новая запись',[{id:'d',l:'Дата',t:'date',v:d},{id:'y',l:'Тип смены',t:'sel',o:[['n','Ночная'],['d','Дневная']]},{id:'p',l:'Оплата, ₽',t:'number'},{id:'h',l:'Часы',t:'number'}],v=>{S.shifts.push({id:Date.now(),date:v.d||d,type:v.y,pay:+v.p||0,h:+v.h||0});selDay=v.d||d;sv()},h)}
function add(){
 if(tab=='bal'){pc='tbank';form('Новая карта',[{id:'s',l:'Баланс, ₽',t:'number'}],v=>{S.banks.push({id:Date.now(),code:pc,sum:+v.s||0});ci=S.banks.length-1;sv()},'<div class="sub">Выберите банк</div>'+pk(pc))}
 else if(tab=='dream')editCar();
 else if(tab=='buy')form('Новая вещь',[{id:'t',l:'Название (например, стол)'},{id:'u',l:'Ссылка на товар (по желанию)'},{id:'p',l:'Цена, ₽',t:'number'}],v=>{if(!v.t)return;S.buys.push({id:Date.now(),title:v.t,url:v.u,price:+v.p||0});sv()});
 else calAdd('t')}
render(true);
</script>
</body>
</html>
